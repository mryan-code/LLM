[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-zero-llm"
version = "0.1.0"
description = "Storm Zero LLM local Python service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = [
    "llama-cpp-python",
    "kokoro-onnx",
    "PyMySQL",
]
# Camera and microphone evaluation. websockets hosts the realtime socket; faster-whisper transcribes PCM.
realtime = [
    "websockets",
    "faster-whisper",
]
image = [
    "torch",
    "torchvision",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "peft",
    "coremltools>=8.0",
    "huggingface-hub",
    "invisible-watermark",
    "scipy",
]
dev = [
    "pytest>=8",
    "PyMySQL",
]

[project.scripts]
storm-zero-llm = "storm_zero_llm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
